    <text x="46" y="126">Print (<tspan fill="#ffe9a8">"Aspiring Backend</tspan></text>
    <text x="82" y="152"><tspan fill="#ffe9a8">Engineer \n"</tspan>)</text>
    <text x="46" y="182">Print (<tspan fill="#ffe9a8">"Open to Full Stack</tspan></text>
    <text x="82" y="203" fill="#ffe9a8">Opportunities\n")</text>
