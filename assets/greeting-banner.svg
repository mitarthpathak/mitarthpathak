  <rect x="0" y="0" width="900" height="34" fill="#05070f"/>
  <text x="20" y="22" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="bold" fill="#ffffff">Hi there 👋, my name is Mitarth Pathak</text>

  <rect x="24" y="58" width="540" height="150" rx="14" fill="#ffffff" opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
