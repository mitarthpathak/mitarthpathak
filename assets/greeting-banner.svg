<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="triGrid" width="46" height="40" patternUnits="userSpaceOnUse">
      <path d="M23 0 L46 40 L0 40 Z" fill="none" stroke="#1c2a52" stroke-width="1"/>
    </pattern>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1330"/>
      <stop offset="100%" stop-color="#101c44"/>
